name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # After the build: Next.js generates the route types (LayoutProps, …) that tsc needs.
      - run: npx tsc --noEmit
      - run: npx playwright-core install --with-deps chromium
      - run: npm run e2e
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/.output/*.png
          retention-days: 7
